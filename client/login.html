<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Ely Shop - Login</title>
        <link
            rel="stylesheet"
            href="./css/styles.css" />
    </head>
    <body>
        <h1 class="section-title">Log In</h1>

        <form
            class="login-form container"
            action="get">
            <div class="input-group">
                <label for="username">Username</label>
                <input
                    required
                    name="username"
                    id="username"
                    type="text" />
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    required
                    name="password"
                    id="password"
                    type="password" />
            </div>

            <button
                class="btn btn-primary"
                type="submit">
                Log in
            </button>
        </form>
    </body>
</html>
